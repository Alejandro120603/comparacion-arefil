": [0, 65], "ft": [1731, 2434], "sec": [["Contacto", 65, 447], ["Estamos listos para ayudarte", 447, 1731]], "final": "/contacto", "st": 304}}}, "note": "Equivale funcionalmente a /contact de Wix, pero con otra URL y otro contenido; por eso aparece como página nueva y /contact como redirigida."}, {"k": "cotizacion", "name": "Solicitar cotización", "id": "—", "type": "Nueva (sin equivalente en Wix)", "fam": "Páginas nuevas", "menu": "Pie y botones de las páginas de familia", "orig": "—", "dev": "/cotizacion", "final": "/cotizacion", "hops": [{"status": 200, "url": "/cotizacion"}], "slash": [{"status": 308, "url": "/cotizacion/"}, {"status": 200, "url": "/cotizacion"}], "ho": 404, "kind": "nueva", "label": "Nueva", "group": "nuevas", "changes": "Formulario de solicitud de cotización (demostración identificada) con línea de producto, número de parte y canales directos.", "kept": null, "sim": {}, "hr": {}, "cls": [null, 0], "words": [0, 100], "issues": ["P1 · Formulario en modo demostración: falta un servicio real de envío."], "shots": {"escritorio": {"o": null, "n": {"f": "screenshots/nueva_version/escritorio/cotizacion.jpg", "t": "screenshots/miniaturas/nueva_version/escritorio/cotizacion.jpg", "w": 1440, "h": 1539, "hd": [0, 73], "ft": [1110, 1539], "sec": [["Solicitar cotización", 73, 489], ["¿Qué necesitas?", 489, 1110]], "final": "/cotizacion", "st": 200}}, "movil": {"o": null, "n": {"f": "screenshots/nueva_version/movil/cotizacion.jpg", "t": "screenshots/miniaturas/nueva_version/movil/cotizacion.jpg", "w": 390, "h": 2801, "hd": [0, 65], "ft": [1574, 2801], "sec": [["Solicitar cotización", 65, 417], ["¿Qué necesitas?", 417, 1574]], "final": "/cotizacion", "st": 200}}, "tablet": {"o": null, "n": {"f": "screenshots/nueva_version/tablet/cotizacion.jpg", "t": "screenshots/miniaturas/nueva_version/tablet/cotizacion.jpg", "w": 768, "h": 2088, "hd": [0, 65], "ft": [1385, 2088], "sec": [["Solicitar cotización", 65, 417], ["¿Qué necesitas?", 417, 1385]], "final": "/cotizacion", "st": 200}}}, "note": "Sin equivalente en Wix."}], "sections": {"resumen": {"intro": "Comparación de las 95 páginas del clon de Wix con la versión definitiva de desarrollo (origin/dev), más las páginas que solo existen en la nueva versión. Solo dos columnas: ORIGINAL y NUEVA VERSIÓN.", "bullets": ["<b>95<\/b> páginas originales comparadas: <b>5<\/b> rediseñadas, <b>88<\/b> con el diseño de Wix conservado y <b>2<\/b> redirigidas (/contact → /contacto, /atlas-copco → /herramientas-a-c).", "<b>3<\/b> páginas nuevas: /productos/filtracion, /contacto y /cotizacion.", "Contenido conservado: 71/71 PDF únicos, 412/417 imágenes de contenido, 23/23 vídeos y 18/18 vídeos de YouTube. Las 5 imágenes que no se usan las sustituyó el rediseño de Inicio y Nosotros.", "Contactos: las 98 páginas usan solo [teléfono oculto] (tel: y WhatsApp) y [correo oculto]. Ningún formulario afirma haber enviado nada.", "Sin pendientes P0. 6 pendientes P1: envío real de formularios, CLS y carga en móvil de páginas heredadas, contenido corporativo, multimedia provisional y dominio/SEO.", "Pruebas del proyecto sobre este build: test:routes (96 rutas, 603 enlaces y recursos, 25 redirecciones) y test:content (95 páginas) en verde."]}, "comparador": "Busca cualquier página, cambia entre escritorio, móvil y tablet, y compara lado a lado (ambas columnas se desplazan juntas), con el deslizador antes/después o por secciones. Haz clic en una captura para ampliarla a tamaño real.", "inicio": "Inicio se rediseñó con la maqueta aprobada. Debajo: páginas completas en tres tamaños y cada bloque importante comparado por separado.", "nosotros": "Nosotros se rediseñó con la maqueta aprobada y conserva el texto de Wix. Misión, visión y valores siguen pendientes de información oficial: no se inventó contenido.", "productos": "En Wix, PRODUCTOS era un submenú y la página /productos estaba vacía. La nueva versión añade un mega menú, un catálogo general y la página de familia Filtración.", "filtracion": "Página nueva sin equivalente directo en Wix (las tres líneas de filtración eran entradas sueltas del submenú). Enlaza a /filtros-donaldson, /filtros-baldwin, /filtros-industriales y a sus páginas interiores.", "productos_links": "Comprobado con el navegador: el mega menú enlaza a /productos/filtracion, a las 10 páginas originales de cada línea y a «Ver todo el catálogo»; /productos enlaza a las mismas páginas. La prueba de rutas del proyecto (603 enlaces y recursos internos) responde 200 sin redirecciones.", "categorias": "Las diez categorías del submenú de Wix. Nueve conservan intencionalmente el diseño de Wix (no hay maqueta aprobada para ellas); solo cambian la cabecera y el pie. Instrumentos Murphy, que estaba vacía en Wix, tiene ahora una página propia.", "interiores": "Todas las páginas interiores del inventario, agrupadas por familia. «Diseño original conservado intencionalmente»: el cuerpo es el de Wix y cambian la cabecera y el pie. La similitud mide los píxeles del contenido sin cabecera ni pie (100 % = idéntico; los carruseles y vídeos bajan algunos puntos). Abre cualquier tarjeta en el comparador.", "interior_examples": ["filtros-donaldson", "akron-hydraulic-xlf", "carcasas", "herramientas-atlas-copco", "catalogo-akron", "youtube-atlas"], "fam_order": ["Filtros Donaldson", "Filtros Baldwin", "Filtros industriales", "Lubricantes Akron y MXL", "Repsol", "Generadores Endress", "Refacciones Case", "Instrumentos Murphy", "Herramientas Atlas Copco", "Acoplamientos Gummi", "Páginas especiales"], "referencia": "Mismos cinco fabricantes. Los enlaces se comprobaron el 27/10/2026 con Chromium sin interfaz y con curl; no se inició sesión en ningún proveedor.", "contacto": "La URL /contact de Wix redirige (308) a /contacto. Se comprobó visual y funcionalmente que las 98 páginas de dev usan solo los destinos autorizados.", "movil": "Primera pantalla y menú desplegado en móvil (390×844) y escritorio.", "nuevas": "Páginas que no existen en el clon de Wix (responden 404 en el original).", "phase1": "Rutas de una fase intermedia de desarrollo (no existían en Wix). Hoy redirigen a la página vigente con la misma información; se listan para documentar ambas direcciones.", "funcional": "Comprobado con Chromium sobre los dos sitios locales. Las funciones de demostración se indican como tales.", "contenido": "Recalculado sobre el HTML servido por los dos sitios (documento completo, ambas variantes de Wix) y sobre el DOM renderizado. No se reutilizaron las cifras del reporte anterior.", "pdf_links_note": "Dev cuenta más referencias porque el HTML incluye también los datos de hidratación de React; los PDF únicos son los mismos.", "img_note": "Las 5 que faltan pertenecen a Inicio (logotipos de Gummi, Endress y Repsol de Wix y el collage de hexágonos) y Nosotros (banner de Endress): las sustituyó el rediseño. Los archivos siguen en public/wix/media.", "vid_note": "En los carruseles, dev monta solo el vídeo de la diapositiva visible; los demás están en los datos de la página y se cargan al avanzar (comprobado: «Diapositiva siguiente» monta el vídeo siguiente).", "text_note": "Comparación de palabras de cuatro letras o más entre original y dev. Las diferencias son los contactos antiguos sustituidos en las fichas de Atlas Copco.", "inventario": "Estado HTTP de las dos versiones, cadena de redirección, recursos conservados, similitud visual, CLS medido en móvil y pendientes. Las URL originales de Wix terminaban en «/»: en dev responden 308 hacia la misma ruta sin barra (200).", "pendientes": "Solo pendientes verificados. Una diferencia que corresponde al rediseño aprobado no se cuenta como error.", "galeria": "Todas las capturas del reporte (miniaturas de la parte superior; clic para verlas completas).", "content_tests": "Pruebas del propio proyecto sobre este mismo build: <code>test:content<\/code> (inventario de referencia del sitio original) → «Páginas originales comprobadas: 95 · PDF: 107/107 · imágenes: 594/594 · vídeos: 23/23 · YouTube: 21/21 · sin pérdidas». <code>test:routes<\/code> → «Rutas: 96 · redirecciones: 25 · enlaces y recursos internos comprobados: 603 · todas responden 200». Esa prueba cuenta referencias por página y excluye las páginas rediseñadas; la tabla de arriba cuenta archivos únicos sobre las 95 páginas, por eso las cifras no coinciden."}, "blocks": {"inicio": [{"t": "Header y menú de navegación", "o": [0, 0, 1440, 61], "n": [0, 0, 1440, 73], "antes": "Barra negra de 61 px con cinco textos dorados (INICIO, NOSOTROS, PRODUCTOS, REFERENCIA CRUZADA, CONTACTO) y submenús al pasar el ratón. Sin logotipo ni datos de contacto.", "ahora": "Cabecera fija oscura de 73 px: logotipo + «AREFIL S.A. de C.V.», cinco entradas con estado activo, mega menú PRODUCTOS, desplegable REFERENCIA CRUZADA, teléfono, correo y botón de WhatsApp.", "mejoras": ["Identidad visible en todas las páginas.", "Contacto directo desde la cabecera (tel:, mailto:, wa.me).", "Menús accesibles con teclado (Enter, Tab, Escape)."], "pend": ["Sin pendientes visuales."]}, {"t": "Logo", "o": [930, 80, 1160, 250], "n": [90, 0, 470, 73], "antes": "El logotipo solo aparecía dentro del contenido de Inicio, junto a los hexágonos.", "ahora": "Logotipo en la cabecera de las 98 páginas, enlazado a Inicio, y en el pie.", "mejoras": ["Presencia de marca constante."], "pend": ["Se reutiliza el logotipo de Wix (no hay versión vectorial)."]}, {"t": "Hero principal y vídeo industrial", "o": [0, 61, 1440, 700], "n": [0, 73, 1440, 790], "antes": "Collage de tres hexágonos con fotos de banco (oficina, apretón de manos), columna de logotipos y un párrafo sobre fondo negro. Inicio no tenía vídeo.", "ahora": "Héroe a todo el ancho con vídeo de refinería en bucle (póster JPG, botón de pausa; no se descarga en móvil), degradado y franja de cuatro beneficios.", "mejoras": ["Mensaje principal claro en la primera pantalla.", "Vídeo silenciado con control de pausa (accesibilidad)."], "pend": ["El vídeo y la foto de la refinería son material de banco de imágenes: p /* ---------- helpers de capturas ---------- */
function shotOf(p, vp, side) { return p.shots?.[vp]?.[side] || null; }
function img(s, alt, cls = "") { return s ? `<img src="${esc(s.f)}" alt="${esc(alt)}" loading="lazy" width="${s.w}" height="${s.h}" class="${cls}" data-lb="${esc(s.f)}" data-cap="${esc(alt)}">` : ""; }
function ph(p, side, vp) {
  if (side === "o" && p.kind === "nueva") return `<div class="ph"><b>Sin equivalente en Wix</b><span>Página creada en la nueva versión.</span></div>`;
  if (vp === "tablet") return `<div class="ph"><b>Sin captura de tablet</b><span>La vista 768 px se capturó solo para las páginas principales y diseños especiales.</span></div>`;
  return `<div class="ph"><b>Captura no disponible</b></div>`;
}
function colhead(side, p, vp) {
  const s = shotOf(p, vp, side);
  const route = side === "o" ? p.orig : (p.kind === "redirigida" ? `${p.dev} → ${p.final}` : p.final);
  return `<div class="colhead ${side}">${side === "o" ? "ORIGINAL — WIX" : "NUEVA VERSIÓN — DEV"}<small>${esc(route)}${s ? ` · ${s.w}×${s.h}` : ""}</small></div>`;
}
/* recorte por CSS de una captura completa: box = [x0,y0,x1,y1] en píxeles de la captura */
function crop(s, box, cap) {
  if (!s) return `<div class="ph" style="min-height:120px"><b>—</b></div>`;
  let [x0, y0, x1, y1] = box; x1 = Math.min(x1 ?? s.w, s.w); y1 = Math.min(y1, s.h); const w = x1 - x0, h = Math.max(1, y1 - y0);
  return `<div class="crop" style="aspect-ratio:${w}/${h};max-width:${Math.max(w, 320)}px" data-lb="${esc(s.f)}" data-cap="${esc(cap || "")}" data-y="${y0}"><img src="${esc(s.f)}" alt="${esc(cap || "")}" loading="lazy" style="width:${(s.w / w) * 100}%;left:${(-x0 / w) * 100}%;top:${(-y0 / h) * 100}%"></div>${cap ? `<div class="crop-cap">${esc(cap)}</div>` : ""}`;
}
function segments(s) {
  if (!s) return [];
  const out = [];
  if (s.hd) out.push(["Cabecera", 0, s.hd[1]]);
  for (const [l, a, b] of s.sec) if (b - a > 30) out.push([l && !/^comp-/.test(l) ? l : "Sección", a, b]);
  if (s.ft) out.push(["Pie", s.ft[0], s.ft[1]]);
  return out;
}

/* ---------- resultados de búsqueda ---------- */
function norm(s) { return String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, ""); }
function search(q) {
  q = norm(q.trim()); if (!q) return [];
  return P.filter((p) => norm(`${p.name} ${p.orig} ${p.dev} ${p.final} ${p.fam} ${p.type}`).includes(q)).slice(0, 30);
}
function bindSearch(inp, box, onPick) {
  let act = 0, list = [];
  const draw = () => { box.innerHTML = list.map((p, i) => `<button role="option" data-k="${p.k}" class="${i === act ? "act" : ""}">${esc(p.name)} ${badge(p)}<small>${esc(p.orig)} → ${esc(p.final)}</small></button>`).join("") || (inp.value ? `<button disabled>Sin resultados</button>` : ""); box.classList.toggle("show", !!inp.value); };
  inp.addEventListener("input", () => { list = search(inp.value); act = 0; draw(); });
  inp.addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown") { act = Math.min(act + 1, list.length - 1); draw(); e.preventDefault(); }
    if (e.key === "ArrowUp") { act = Math.max(act - 1, 0); draw(); e.preventDefault(); }
    if (e.key === "Enter" && list[act]) { onPick(list[act].k); box.classList.remove("show"); inp.value = ""; }
    if (e.key === "Escape") { box.classList.remove("show"); }
  });
  box.addEventListener("click", (e) => { const b = e.target.closest("button[data-k]"); if (b) { onPick(b.dataset.k); box.classList.remove("show"); inp.value = ""; } });
  document.addEventListener("click", (e) => { if (!box.contains(e.target) && e.target !== inp) box.classList.remove("show"); });
}

function pcard(p) {
  const d = p.shots.escritorio || {};
  const th = (s, side) => s ? `<div><span style="background:${side === "o" ? "#5a6270" : "#c8232c"}">${side === "o" ? "WIX" : "DEV"}</span><img src="${esc(s.t)}" alt="" loading="lazy"></div>` : `<div class="ph" style="min-height:0;padding:6px;font-size:11px">${side === "o" && p.kind === "nueva" ? "Sin equivalente" : "—"}</div>`;
  const iss = p.issues.filter((i) => /^P[01]/.test(i)).length;
  return `<div class="card pcard"><div class="pthumbs" data-open="${p.k}" title="Abrir en el comparador">${th(d.o, "o")}${th(d.n, "n")}</div>
  <div class="body"><b>${esc(p.name)}</b><small>${esc(p.orig)}${p.final !== p.dev ? ` → ${esc(p.final)}` : ""}</small>
  <div class="row">${badge(p)}${p.sim.escritorio != null ? `<span class="badge" title="Similitud del contenido (escritorio)">≈ ${pctf(p.sim.escritorio)}</span>` : ""}${iss ? `<span class="badge b-bad">${iss} P0/P1</span>` : ""}</div>
  <div class="row"><button class="btn" data-open="${p.k}">Comparar</button><button class="btn" data-open="${p.k}" data-vp="movil">Móvil</button></div></div></div>`;
}
function pageGrid(list) { return `<div class="grid pgrid">${list.map(pcard).join("")}</div>`; }

/* ---------- bloque comparativo grande (página completa + notas) ---------- */
function bigPair(p, vp, title) {
  const o = shotOf(p, vp, "o"), n = shotOf(p, vp, "n");
  const id = `lim-${p.k}-${vp}`;
  return `<div class="block card pad"><div class="block-head"><h3>${esc(title || p.name)} · ${VPL[vp]}</h3><div class="flex"><button class="btn" data-toggle="${id}">Ver página completa</button><button class="btn" data-open="${p.k}" data-vp="${vp}">Abrir en el comparador</button></div></div>
  <div class="two" style="${vp !== "escritorio" ? "max-width:860px" : ""}"><div>${colhead("o", p, vp)}<div class="shotbox limit ${id}">${o ? img(o, p.name + " · original") : ph(p, "o", vp)}</div></div><div>${colhead("n", p, vp)}<div class="shotbox limit ${id}">${n ? img(n, p.name + " · nueva versión") : ph(p, "n", vp)}</div></div></div></div>`;
}
function notes(b) {
  const li = (x) => Array.isArray(x) ? `<ul>${x.map((i) => `<li>${i}</li>`).join("")}</ul>` : x;
  return `<div class="notes"><div class="note antes"><b>Antes</b>${li(b.antes)}</div><div class="note ahora"><b>Ahora</b>${li(b.ahora)}</div><div class="note mejoras"><b>Mejoras</b>${li(b.mejoras)}</div><div class="note pend"><b>Pendientes</b>${li(b.pend)}</div></div>`;
}
function blockPairs(k) {
  const p = byK[k], o = shotOf(p, "escritorio", "o"), n = shotOf(p, "escritorio", "n");
  return (D.blocks[k] || []).map((b) => `<div class="block card pad"><div class="block-head"><h3>${esc(b.t)}</h3></div>
    <div class="two"><div>${colhead("o", p, "escritorio")}<div class="shotbox" style="padding:8px">${b.o ? crop(o, b.o) : `<div class="ph" style="min-height:140px"><b>Sin equivalente en Wix</b><span>${esc(b.ono || "")}</span></div>`}${b.oextra ? b.oextra.map((e) => `<div class="mt">${crop(shotOf(byK[e.k] || p, e.vp || "escritorio", "o") || stateShot(e.state, "o"), e.box, e.cap)}</div>`).join("") : ""}</div></div>
    <div>${colhead("n", p, "escritorio")}<div class="shotbox" style="padding:8px">${b.n ? crop(n, b.n) : `<div class="ph" style="min-height:140px"><b>—</b></div>`}${b.nextra ? b.nextra.map((e) => `<div class="mt">${crop(e.state ? stateShot(e.state, "n") : shotOf(byK[e.k] || p, e.vp || "escritorio", "n"), e.box, e.cap)}</div>`).join("") : ""}</div></div></div>
    ${notes(b)}</div>`).join("");
}
function stateShot(name, side) { const s = D.states.find((x) => x.name === name); return s ? s[side] : null; }
function statePair(name, title, narrow) {
  const s = D.states.find((x) => x.name === name);
  return `<div class="block card pad"><div class="block-head"><h3>${esc(title || s.title)}</h3><a class="btn" href="screenshots/comparaciones/estado-${name}.jpg" target="_blank" rel="noopener">Composición JPG</a></div>
    <div class="two" style="${narrow ? "max-width:820px" : ""}"><div><div class="colhead o">ORIGINAL — WIX<small>${esc(s.route)}</small></div><div class="shotbox">${img(s.o, title + " · original")}</div></div><div><div class="colhead n">NUEVA VERSIÓN — DEV<small>${esc(s.route)}</small></div><div class="shotbox">${img(s.n, title + " · nueva versión")}</div></div></div>${s.notes ? notes(s.notes) : ""}</div>`;
}
function secHead(id, eyebrow, title, intro) { return `<div class="sec-head"><div><div class="eyebrow">${eyebrow}</div><h2>${title}</h2>${intro ? `<p>${intro}</p>` : ""}</div></div>`; }

H += `<section class="sec" id="pendientes">${secHead("pendientes", "17 · Mejoras pendientes", "Pendientes clasificados por prioridad", S.pendientes)}
<div class="flex" style="margin-bottom:12px">${["P0", "P1", "P2", "P3"].map((k) => `<span class="badge ${k}">${k} · ${D.pending.filter((x) => x.prio === k).length}</span>`).join("")}<span class="small muted">P0 crítico · P1 importante · P2 mejora · P3 opcional</span></div>
<div class="card">${D.pending.map((x) => `<div class="pend-item" id="${x.id}"><div><h4><span class="badge ${x.prio}">${x.prio}</span>${esc(x.id)} · ${esc(x.title)} <span class="badge">${esc(x.cat)}</span></h4><p>${x.detail}</p><p class="small"><b>Afecta:</b> ${x.where}</p><p class="small"><b>Siguiente paso:</b> ${x.next}</p></div><div>${x.ev ? `<img src="${esc(x.ev)}" alt="Evidencia ${esc(x.id)}" loading="lazy" data-lb="${esc(x.ev)}" data-cap="${esc(x.id)} · ${esc(x.title)}">${x.evcap ? `<div class="crop-cap">${esc(x.evcap)}</div>` : ""}` : `<div class="ph" style="min-height:120px"><span>Sin evidencia visual: ${esc(x.noev || "pendiente funcional o de información")}</span></div>`}</div></div>`).join("")}</div></section>`;

H += `<section class="sec" id="galeria">${secHead("galeria", "18 · Galería de capturas", "Todas las capturas", S.galeria)}
<div class="filters"><div class="seg" id="gside"><button data-s="" class="on">Ambas</button><button data-s="o">Original</button><button data-s="n">Nueva versión</button></div><div class="seg" id="gvp"><button data-v="escritorio" class="on">Escritorio</button><button data-v="movil">Móvil</button><button data-v="tablet">Tablet</button><button data-v="estados">Estados de menú</button></div><input type="search" id="gq" placeholder="Filtrar…" aria-label="Filtrar galería"><span class="muted small" id="gcount"></span></div>
<div class="grid gallery" id="gal"></div></section>`;

const V = D.validation;
H += `<section class="sec" id="validacion">${secHead("validacion", "19 · Validación del reporte", "Comprobaciones realizadas antes de entregar", "")}
<div class="card pad">${V ? V.checks.map((c) => `<div class="check"><span class="badge ${c.ok ? "b-ok" : "b-bad"}">${c.ok ? "OK" : "FALLA"}</span><div><b>${esc(c.name)}</b><div class="small muted">${esc(c.detail)}</div></div></div>`).join("") : "<p>La validación se ejecuta después de generar el reporte.</p>"}</div></section>`;

$("#main").innerHTML = H;

/* ---------- comportamiento ---------- */
bindSearch($("#q"), $("#qres"), (k) => openCmp(k));
bindSearch($("#cq"), $("#cqres"), (k) => openCmp(k));
$("#cvp").onclick = (e) => { const b = e.target.closest("button"); if (b && !b.disabled) { C.vp = b.dataset.v; renderCmp(); } };
$("#cmode").onclick = (e) => { const b = e.target.closest("button"); if (b) { C.mode = b.dataset.m; renderCmp(); } };
$("#czoom").onclick = (e) => { const b = e.target.closest("button"); if (b) { C.zoom = +b.dataset.z; renderCmp(); } };
$("#cfull").onclick = () => { C.full = !C.full; renderCmp(); };
const order = P.map((p) => p.k);
$("#cprev").onclick = () => openCmp(order[(order.indexOf(C.k) - 1 + order.length) % order.length]);
$("#cnext").onclick = () => openCmp(order[(order.indexOf(C.k) + 1) % order.length]);
document.addEventListener("click", (e) => {
  const o = e.target.closest("[data-open]"); if (o) { openCmp(o.dataset.open, o.dataset.vp); return; }
  const t = e.target.closest("[data-toggle]"); if (t) { const els = $$("." + t.dataset.toggle); const open = !els[0]?.classList.contains("open"); els.forEach((x) => x.classList.toggle("open", open)); t.textContent = open ? "Contraer" : "Ver página completa"; return; }
  const l = e.target.closest("[data-lb]"); if (l) lightbox(l.dataset.lb, l.dataset.cap, +l.dataset.y || 0);
});
const lb = $("#lb");
let fit = false;
function lightbox(src, cap, y) { $("#lbT").textContent = cap || src; $("#lbOpen").href = src; $("#lbB").innerHTML = `<img src="${esc(src)}" alt="${esc(cap || "")}" class="${fit ? "fit" : ""}">`; lb.showModal(); const im = $("#lbB img"); const go = () => { $("#lbB").scrollTop = y ? Math.max(0, y - 20) : 0; }; im.complete ? go() : im.addEventListener("load", go, { once: true }); }
$("#lbClose").onclick = () => lb.close();
$("#lbFit").onclick = () => { fit = !fit; $("#lbB img")?.classList.toggle("fit", fit); $("#lbFit").textContent = fit ? "Tamaño real" : "Ajustar a la pantalla"; };
lb.addEventListener("click", (e) => { if (e.target === $("#lbB")) lb.close(); });

/* inventario */
function invRows() {
  const q = norm($("#tq").value), k = $("#tk").value, t = $("#tt").value, onlyP = $("#tp").checked;
  const list = P.filter((p) => (!q || norm(`${p.name} ${p.orig} ${p.final} ${p.fam} ${p.changes} ${p.issues.join(" ")}`).includes(q)) && (!k || p.kind === k) && (!t || p.type === t) && (!onlyP || p.issues.length));
  $("#tcount").textContent = `${list.length} de ${P.length}`;
  $("#inv tbody").innerHTML = list.map((p) => { const c = p.kept; return `<tr><td><b>${esc(p.name)}</b><br><span class="muted small">${esc(p.fam)}</span></td><td><code class="wrap">${esc(p.orig)}</code></td><td><code class="wrap">${esc(p.final)}</code>${p.kind === "redirigida" ? `<br><span class="small muted">${hops(p.hops)}</span>` : ""}</td><td class="small">orig <code>${p.orig === "—" ? "404" : p.ho}</code><br>dev <code>${p.hops.map((h) => h.status).join("→")}</code>${p.slash ? `<br><span class="muted">con «/» ${p.slash.map((h) => h.status).join("→")}</span>` : ""}</td><td class="small">${esc(p.type)}</td><td>${badge(p)}</td><td class="small">${c ? `${c.pdf[1]}/${c.pdf[0]} · ${c.img[1]}/${c.img[0]} · ${c.vid[1]}/${c.vid[0]} · ${c.yt[1]}/${c.yt[0]} · ${pctf(c.txt)}` : "—"}</td><td class="num">${p.sim.escritorio != null ? pctf(p.sim.escritorio) : "—"}</td><td class="num">${p.cls[1] != null ? p.cls[1].toFixed(2) : "—"}${p.cls[0] != null ? `<br><span class="muted small">orig ${p.cls[0].toFixed(2)}</span>` : ""}</td><td class="small">${p.issues.map(prio).join("<br>") || "—"}</td><td><button class="btn" data-open="${p.k}">Comparar</button></td></tr>`; }).join("");
}
["tq", "tk", "tt", "tp"].forEach((id) => $("#" + id).addEventListener("input", invRows));
invRows();
/* interiores */
function intFilter() {
  const q = norm($("#iq").value), f = $("#ifam").value; let n = 0;
  $$("#intgrid .famblock").forEach((fb) => { let vis = 0; $$(".pcard", fb).forEach((c) => { const p = byK[$("[data-open]", c).dataset.open]; const ok = (!f || p.fam === f) && (!q || norm(`${p.name} ${p.orig} ${p.fam}`).includes(q)); c.style.display = ok ? "" : "none"; vis += ok; }); fb.style.display = vis ? "" : "none"; n += vis; });
  $("#icount").textContent = `${n} páginas`;
}
$("#iq").addEventListener("input", intFilter); $("#ifam").addEventListener("input", intFilter); intFilter();
/* galería */
const G = { s: "", v: "escritorio" };
function gal() {
  const q = norm($("#gq").value); const items = [];
  if (G.v === "estados") for (const s of D.states) { for (const side of ["o", "n"]) if ((!G.s || G.s === side) && s[side] && (!q || norm(s.title).includes(q))) items.push({ s: s[side], cap: s.title, side }); }
  else for (const p of P) for (const side of ["o", "n"]) { const s = shotOf(p, G.v, side); if (s && (!G.s || G.s === side) && (!q || norm(`${p.name} ${p.orig} ${p.final}`).includes(q))) items.push({ s, cap: p.name, side, route: side === "o" ? p.orig : p.final }); }
  $("#gcount").textContent = `${items.length} capturas`;
  $("#gal").innerHTML = items.map((i) => `<div class="card gal" data-lb="${esc(i.s.f)}" data-cap="${esc(i.cap)} · ${i.side === "o" ? "ORIGINAL" : "NUEVA VERSIÓN"}"><img src="${esc(i.s.t)}" alt="" loading="lazy"><div><b style="color:${i.side === "o" ? "var(--gray)" : "var(--red)"}">${i.side === "o" ? "WIX" : "DEV"}</b> ${esc(i.cap)}<br><small>${esc(i.route || "")} · ${i.s.w}×${i.s.h}</small></div></div>`).join("");
}
$("#gside").onclick = (e) => { const b = e.target.closest("button"); if (!b) return; G.s = b.dataset.s; $$("#gside button").forEach((x) => x.classList.toggle("on", x === b)); gal(); };
$("#gvp").onclick = (e) => { const b = e.target.closest("button"); if (!b) return; G.v = b.dataset.v; $$("#gvp button").forEach((x) => x.classList.toggle("on", x === b)); gal(); };
$("#gq").addEventListener("input", gal); gal();
/* navegación activa y menú móvil */
const secs = $$("section.sec");
const io = new IntersectionObserver((es) => { for (const e of es) if (e.isIntersecting) $$("#nav a").forEach((a) => a.classList.toggle("on", a.dataset.id === e.target.id)); }, { rootMargin: "0px 0px -88% 0px" });
secs.forEach((s) => io.observe(s));
$("#menuBtn").onclick = () => { const o = $("#side").classList.toggle("open"); $("#menuBtn").setAttribute("aria-expanded", o); };
$("#nav").onclick = () => { $("#side").classList.remove("open"); $("#menuBtn").setAttribute("aria-expanded", "false"); };
const h = decodeURIComponent(location.hash.slice(1));
if (h.startsWith("comparador:")) { const k = h.split(":")[1]; if (byK[k]) { C.k = k; } }
renderCmp();
if (h.startsWith("comparador:")) setTimeout(() => document.getElementById("comparador").scrollIntoView(), 50);
window.__report = { ok: true, pages: P.length, open: openCmp, C };
</script>
</body>
</html>
